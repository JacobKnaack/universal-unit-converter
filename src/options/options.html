<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Converter Options</title>
    <link rel="stylesheet" href="assets/style.css">
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
            max-width: 480px;
        }
        h2 {
            margin-top: 0;
        }
        label {
            font-weight: bold;
            display: block;
            margin-top: 18px;
        }
        .row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 6px;
        }
        #fontSizeValue {
            font-weight: normal;
            color: #555;
        }
        #preview {
            margin-top: 28px;
            padding: 20px;
            border: 1px dashed #ccc;
            border-radius: 8px;
        }
        #preview p {
            margin: 0 0 12px 0;
        }
        #previewTooltip {
            display: grid;
            position: static;
        }

        #tooltipTargets {
            margin-top: 10px;
        }
        .target-category {
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-top: 8px;
            padding: 4px 12px;
        }
        .target-category > summary {
            font-weight: bold;
            cursor: pointer;
            padding: 8px 0;
        }
        .target-source {
            padding: 8px 0;
            border-top: 1px solid #eee;
        }
        .target-source:first-of-type {
            border-top: none;
        }
        .target-source-label {
            font-weight: normal;
            margin: 0 0 6px 0;
            display: block;
        }
        .target-checkboxes {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 14px;
        }
        .target-checkboxes label {
            font-weight: normal;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-top: 0;
        }
        .target-checkboxes input {
            margin: 0;
        }
    </style>
</head>
<body>
    <h2>
        Unit Converter Settings
    </h2>

    <label for="tooltipTheme">Tooltip Theme</label>
    <select id="tooltipTheme">
        <option value="dark">Dark</option>
        <option value="light">Light</option>
    </select>

    <label for="underlineColor">Underline Color</label>
    <div class="row">
        <input type="color" id="underlineColor" value="#800080">
    </div>

    <label for="tooltipFontSize">Tooltip Font Size <span id="fontSizeValue"></span></label>
    <div class="row">
        <input type="range" id="tooltipFontSize" min="0.8" max="1.6" step="0.1" value="1.1">
    </div>

    <div id="preview">
        <p>Preview: The board is <span class="uuc-unit">10 cm</span> thick.</p>
        <div class="uuc-tooltip" id="previewTooltip">
            <div class="uuc-tooltip-row">
                <span class="uuc-tooltip-value">3.94</span>
                <span class="uuc-tooltip-unit">in</span>
            </div>
            <div class="uuc-tooltip-row">
                <span class="uuc-tooltip-value">100.00</span>
                <span class="uuc-tooltip-unit">mm</span>
            </div>
        </div>
    </div>

    <label>Tooltip Conversion Targets</label>
    <p style="font-weight: normal; margin: 4px 0 0 0; color: #555;">
        Choose which unit(s) each detected value should be converted to in the on-page tooltip.
    </p>
    <div id="tooltipTargets"></div>

    <p id="status" style="color: green; margin-top: 10px"></p>
    <script type="module" src="assets/options.js"></script>
</body>
</html>
