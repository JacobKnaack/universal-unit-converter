<!DOCTYPE html>
<html>
<head>
  <title>Unit Converter</title>
  <style>
    :root {
      --glass-bg: rgba(255, 255, 255, 0.55);
      --glass-border: rgba(255, 255, 255, 0.35);
      --text: #1f2328;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --radius: 12px;
      --shadow: 0 4px 16px rgba(0,0,0,0.15);
    }

    body {
      font-family: system-ui, sans-serif;
      padding: 14px;
      width: 260px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }

    h2 {
      margin: 0 0 10px 0;
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
    }

    label {
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 4px;
      display: block;
    }

    select, input {
      width: 100%;
      padding: 8px 10px;
      margin-top: 4px;
      border-radius: var(--radius);
      border: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.65);
      font-size: 0.9rem;
      box-sizing: border-box;
      backdrop-filter: blur(6px);
      transition: border-color 0.15s ease;
    }

    select:focus, input:focus {
      border-color: var(--accent);
      outline: none;
    }

    button {
      width: 100%;
      padding: 9px;
      margin-top: 10px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: var(--radius);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease;
    }

    button:hover {
      background: var(--accent-hover);
    }

    button:active {
      transform: scale(0.98);
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 6px 0;
    }

    .checkbox-row input {
      width: 18px;
      height: 18px;
    }

    #result {
      margin-top: 12px;
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--text);
      min-height: 20px;
    }
  </style>
</head>

<body>

  <!-- SECTION 1: AUTO CONVERSION SETTINGS -->
  <div class="card">
    <h2>Automatic Conversion<span id="status"></span></h2>

    <label for="system">Target System:</label>
    <select id="system">
      <option value="imperial">Display Imperial</option>
      <option value="metric">Display Metric</option>
    </select>

    <div style="margin-top: 10px; font-weight: 600;">Units to Convert:</div>

    <div class="checkbox-row">
      <input type="checkbox" id="convertLength" checked>
      <span>Length</span>
    </div>
    <div class="checkbox-row">
      <input type="checkbox" id="convertTemperature" checked>
      <span>Temperature</span>
    </div>
    <div class="checkbox-row">
      <input type="checkbox" id="convertMass" checked>
      <span>Mass</span>
    </div>
    <div class="checkbox-row">
      <input type="checkbox" id="convertVolume" checked>
      <span>Volume</span>
    </div>
    <div class="checkbox-row">
      <input type="checkbox" id="convertVelocity" checked>
      <span>Velocity</span>
    </div>
    <div class="checkbox-row">
      <input type="checkbox" id="convertCss" checked>
      <span>CSS Units</span>
    </div>
    <div class="checkbox-row">
      <input type="checkbox" id="convertArea" checked>
      <span>Area</span>
    </div>
    <div class="checkbox-row">
      <input type="checkbox" id="convertDensity" checked>
      <span>Density</span>
    </div>
    <div class="checkbox-row" style="margin-top: 10px;">
      <input type="checkbox" id="autoConvert">
      <span>Enable Automatic Conversion</span>
    </div>
    <label for="cssUnitSystem">CSS Units:</label>
    <select id="cssUnitSystem">
      <option value="px">Convert to px</option>
      <option value="rem">Convert to rem</option>
    </select>
  </div>

  <!-- SECTION 2: MANUAL CONVERSION TOOL -->
  <div class="card">
    <h2>Manual Conversion</h2>

    <label for="manualCategory">Category:</label>
    <select id="manualCategory">
      <option value="length">Length</option>
      <option value="temperature">Temperature</option>
      <option value="mass">Mass</option>
      <option value="area">Area</option>
      <option value="volume">Volume</option>
      <option value="velocity">Velocity</option>
      <option value="css">CSS Units</option>
    </select>

    <label for="manualFrom">From Unit:</label>
    <select id="manualFrom"></select>

    <label for="manualTo">To Unit:</label>
    <select id="manualTo"></select>

    <label for="manualValue">Value:</label>
    <input id="manualValue" placeholder="Enter a number">

    <button id="manualConvertBtn">Convert</button>

    <div id="result"></div>
  </div>

  <script src="assets/popup.js"></script>
</body>
</html>
