<!DOCTYPE html>
<html>
<head>
  <title>Unit Converter</title>
  <style>
    :root {
      --glass-bg: rgba(255, 255, 255, 0.55);
      --glass-border: rgba(255, 255, 255, 0.35);
      --text: #1f2328;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --radius: 12px;
      --shadow: 0 4px 16px rgba(0,0,0,0.15);
    }

    body {
      font-family: system-ui, sans-serif;
      padding: 14px;
      width: 260px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }

    h2 {
      margin: 0 0 10px 0;
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
    }

    label {
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 4px;
      display: block;
    }

    select, input {
      width: 100%;
      padding: 8px 10px;
      margin-top: 4px;
      border-radius: var(--radius);
      border: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.65);
      font-size: 0.9rem;
      box-sizing: border-box;
      backdrop-filter: blur(6px);
      transition: border-color 0.15s ease;
    }

    select:focus, input:focus {
      border-color: var(--accent);
      outline: none;
    }

    button {
      width: 100%;
      padding: 9px;
      margin-top: 10px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: var(--radius);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease;
    }

    button:hover {
      background: var(--accent-hover);
    }

    button:active {
      transform: scale(0.98);
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 6px 0;
    }

    .checkbox-row input {
      width: 18px;
      height: 18px;
    }

    /* Utility alignment for the manual section */
    .form-group {
      margin-bottom: 10px;
    }

    .conversion-row {
      display: flex;
      align-items: flex-end;
      gap: 6px;
      margin-top: 10px;
    }

    .field-half {
      flex: 1;
      min-width: 0; /* Prevents select dropdowns from overflowing */
    }

    /* Compact Swap Button styling */
    #swapUnitsBtn {
      width: 32px;
      height: 32px;
      padding: 0;
      margin-top: 0;
      margin-bottom: 2px; /* Visual alignment with select inputs */
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.4);
      color: var(--text);
      border: 1px solid var(--glass-border);
      font-size: 1.1rem;
    }

    #swapUnitsBtn:hover {
      background: rgba(255, 255, 255, 0.7);
    }

    /* Real-time result panel */
    .result-display {
      margin-top: 14px;
      padding: 12px;
      background: rgba(37, 99, 235, 0.1); /* Subtle accent tint */
      border-left: 4px solid var(--accent);
      border-radius: 6px;
      font-weight: 600;
      font-size: 1rem;
      color: var(--text);
      display: flex;
      gap: 4px;
      align-items: baseline;
      word-break: break-all;
    }

    #resultUnit {
      font-size: 0.85rem;
      color: #57606a; /* Muted label color */
      font-weight: 500;
    }
  </style>
</head>

<body>

  <!-- SECTION 1: AUTO CONVERSION SETTINGS -->
  <div class="card">
    <h2>Automatic Conversion<span id="status"></span></h2>

    <div style="margin-top: 10px; font-weight: 600;">Units to Convert:</div>

    <div class="checkbox-row">
      <input type="checkbox" id="convertLength" checked>
      <span>Length</span>
    </div>
    <div class="checkbox-row">
      <input type="checkbox" id="convertTemperature" checked>
      <span>Temperature</span>
    </div>
    <div class="checkbox-row">
      <input type="checkbox" id="convertMass" checked>
      <span>Mass</span>
    </div>
    <div class="checkbox-row">
      <input type="checkbox" id="convertVolume" checked>
      <span>Volume</span>
    </div>
    <div class="checkbox-row">
      <input type="checkbox" id="convertVelocity" checked>
      <span>Velocity</span>
    </div>
    <div class="checkbox-row">
      <input type="checkbox" id="convertCss" checked>
      <span>CSS Units</span>
    </div>
    <div class="checkbox-row">
      <input type="checkbox" id="convertArea" checked>
      <span>Area</span>
    </div>
    <div class="checkbox-row">
      <input type="checkbox" id="convertDensity" checked>
      <span>Density</span>
    </div>
    <div class="checkbox-row" style="margin-top: 10px;">
      <input type="checkbox" id="autoConvert">
      <span>Enable Automatic Conversion</span>
    </div>
  </div>

  <!-- SECTION 2: MANUAL CONVERSION TOOL -->
  <div class="card">
    <h2>Manual Conversion</h2>

    <div class="form-group">
      <label for="manualCategory">Category</label>
      <select id="manualCategory">
        <option value="length">Length</option>
        <option value="temperature">Temperature</option>
        <option value="mass">Mass</option>
        <option value="area">Area</option>
        <option value="volume">Volume</option>
        <option value="velocity">Velocity</option>
        <option value="css">CSS Units</option>
      </select>
    </div>

    <div class="conversion-row">
      <div class="field-half">
        <label for="manualFrom">From</label>
        <select id="manualFrom"></select>
      </div>

      <button id="swapUnitsBtn" type="button" title="Swap Units" aria-label="Swap units">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="m17 2 4 4-4 4"></path>
          <path d="M3 6h18"></path>
          <path d="m7 22-4-4 4-4"></path>
          <path d="M21 18H3"></path>
        </svg>
      </button>

      <div class="field-half">∏
        <label for="manualTo">To</label>
        <select id="manualTo"></select>
      </div>
    </div>

    <div class="form-group" style="margin-top: 12px;">
      <label for="manualValue">Value</label>
      <input id="manualValue" type="number" inputmode="decimal" placeholder="0">
    </div>

    <div id="resultCard" class="result-display">
      <span id="resultValue">0</span>
      <span id="resultUnit"></span>
    </div>
  </div>

  <script src="assets/popup.js"></script>
</body>
</html>
